  .cs-gallery { margin-top: 10px; }

  footer { border-top: 1px solid var(--line); padding: 34px 0; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--faint); margin-top: 40px; }
  footer b { color: var(--accent); }

  @media (max-width: 820px) { .work-grid, .cs-hero, .cs-meta, .cs-3, .cs-two { grid-template-columns: 1fr; } .cs-meta { grid-template-columns: 1fr 1fr; } }

<script>

            '<p class="desc">'+p.desc+'</p>'+
            '<div class="cs-cta"><a class="primary" onclick="return false">↗ Live Site</a><a class="ghost" onclick="return false">GitHub Source</a></div>'+
          '</div>'+
          '<div class="cs-visual" style="background:'+p.grad+'"><div class="card-title"><span class="lb">'+p.tags[0]+'</span><h3>'+p.short+'<br><span class="em" style="color:'+p.hc+'">'+p.title+'</span></h3><div class="m">'+p.tags.join(' · ')+'</div></div>'+
            '<div class="art"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg></div></div>'+
        '</div>'+
        '<div class="cs-meta">'+
          '<div class="m"><div class="k">Role</div><div class="v">'+p.type+'</div></div>'+
          '<div class="m"><div class="k">Duration</div><div class="v">'+p.duration+'</div></div>'+
          '<div class="m"><div class="k">Team</div><div class="v">'+p.team+'</div></div>'+
          '<div class="m"><div class="k">Year</div><div class="v">'+p.year+'</div></div>'+
        '</div>'+
        '<div class="cs-3">'+
          '<div class="cs-block"><div class="ic">'+ic.problem+'</div><h3>Problem</h3><p>'+p.problem+'</p></div>'+
          '<div class="cs-block"><div class="ic">'+ic.solution+'</div><h3>Solution</h3><p>'+p.solution+'</p></div>'+
          '<div class="cs-block"><div class="ic">'+ic.impact+'</div><h3>Impact</h3><p>'+p.impact+'</p></div>'+
        '</div>'+
        '<div class="cs-two">'+
          '<div class="cs-panel"><h3>Tech Stack</h3><div class="cs-stack-pills">'+p.stack.map(function (s){ return '<span>'+s+'</span>'; }).join('')+'</div></div>'+
          '<div class="cs-panel"><h3>Process</h3><ol class="cs-process">'+p.process.map(function (s){ return '<li>'+s+'</li>'; }).join('')+'</ol></div>'+
        '</div>'+
        '<div class="cs-3">'+
          '<div class="cs-block"><h3>Key Features</h3><ul>'+li(p.features)+'</ul></div>'+
          '<div class="cs-block"><h3>Challenges</h3><ul>'+li(p.challenges)+'</ul></div>'+
          '<div class="cs-block"><h3>Learnings</h3><ul>'+li(p.learnings)+'</ul></div>'+
        '</div>'+
        '<div class="cs-gallery"><h3>Project Gallery</h3><div class="g" style="background:'+p.grad+'"><div class="card-title" style="color:#fff"><span class="lb" style="font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.6);background:rgba(255,255,255,.12);padding:3px 8px;border-radius:5px">preview</span><h3 style="margin:12px 0 0;font-size:1.6rem;font-weight:800">'+p.short+' <span style="color:'+p.hc+'">'+p.title+'</span></h3></div></div></div>';
      document.getElementById('backBtn').addEventListener('click', showWork);
      show('case');
      window.scrollTo(0, 0);
    }
    function show(name) {
      document.querySelectorAll('.page').forEach(function (pg){ pg.classList.remove('on'); });
      document.getElementById('page-' + name).classList.add('on');
    }
    function showWork() { show('work'); window.scrollTo(0, 0); }
    document.querySelector('[data-page="work"]').addEventListener('click', showWork);
  })();
</script>
