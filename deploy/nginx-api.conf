# /etc/nginx/sites-available/api.sobirjonswe.uz
# Laravel 13 API behind php-fpm.
# Install:  ln -s /etc/nginx/sites-available/api.sobirjonswe.uz /etc/nginx/sites-enabled/
#
# NOTE: this file is the pre-SSL version. Run certbot afterwards:
#   certbot --nginx -d api.sobirjonswe.uz

server {
    listen 80;
    listen [::]:80;
    server_name api.sobirjonswe.uz;

    # Laravel's front controller lives in public/, never expose the project root.
    root /var/www/portfolio-backend/public;
    index index.php;

    charset utf-8;
    # Must stay above PHP's post_max_size (see 99-portfolio.ini), which in turn
    # is above the app's own 5 MB per-image limit.
    client_max_body_size 20M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Uploaded images live under /storage (a symlink into storage/app/public).
    # Validation already refuses anything that is not really an image, but this
    # makes execution impossible even if something ever slips through: nothing
    # under /storage is handed to php-fpm, whatever its extension.
    location ^~ /storage/ {
        location ~ \.(php|phar|phtml|php\d)$ {
            deny all;
        }
        add_header X-Content-Type-Options "nosniff" always;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/javascript;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
