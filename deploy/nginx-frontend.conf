# /etc/nginx/sites-available/sobirjonswe.uz
# React SPA (Vite build) served as static files, with prerendered per-route
# shells: `npm run build` writes dist/about/index.html, dist/blog/<slug>/index.html
# and so on, each carrying its own <title>/description/OG tags for crawlers.
#
# Install:  ln -s /etc/nginx/sites-available/sobirjonswe.uz /etc/nginx/sites-enabled/
#
# NOTE: this file is the pre-SSL version. Run certbot afterwards:
#   certbot --nginx -d sobirjonswe.uz -d www.sobirjonswe.uz
# Certbot rewrites this file to add the 443 block and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name sobirjonswe.uz www.sobirjonswe.uz;

    root /var/www/portfolio-frontend/dist;
    index index.html;

    # Security headers. Kept at server level and never repeated in a location:
    # nginx only inherits add_header downwards when the inner level declares
    # none of its own, so the locations below use `expires` for caching instead.
    add_header X-Content-Type-Options    "nosniff"                                  always;
    add_header X-Frame-Options           "DENY"                                     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # `$uri/` picks up the prerendered shell for a route (e.g. /blog/my-post/
    # -> /blog/my-post/index.html). /index.html is the fallback for routes with
    # no shell, which React Router then resolves client-side.
    location / {
        # `$uri/index.html` rather than `$uri/`: the latter serves the directory
        # index only after a 301 that appends a trailing slash, which would
        # disagree with the slash-free canonical URL in the prerendered shell.
        try_files $uri $uri/index.html /index.html;
        # Never cache HTML: a stale shell would pin an old asset hash.
        expires -1;
    }

    # Vite emits content-hashed filenames into /assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # Prerendered not-found shell, used for anything nginx itself 404s (a
    # missing asset, say).
    #
    # Unmatched *app* routes still fall through to /index.html above and get a
    # 200 with the SPA's own 404 screen. Making that path a hard 404 instead
    # would break every blog post and news item published since the last
    # frontend build — they have no shell on disk yet — which is a worse
    # failure than a soft 404 on a mistyped URL.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    location = /sitemap.xml { expires 1h; }
    location = /robots.txt  { expires 1h; access_log off; }
    location = /og-image.png { expires 7d; access_log off; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    # Do not serve dotfiles (.env, .git, ...) if one ever lands in the web root.
    location ~ /\. {
        deny all;
    }
}
